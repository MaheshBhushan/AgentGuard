name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy agentguard
      - run: pytest --cov=agentguard --cov-report=term-missing

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Dogfood AgentGuard on its own pull request
        uses: ./
        if: github.event_name == 'pull_request'
        with:
          profile: minimal
          fail-on: error,incomplete
      - name: Dogfood AgentGuard on pushed commit
        uses: ./
        if: github.event_name == 'push'
        with:
          base-ref: HEAD~1
          profile: minimal
          fail-on: error,incomplete
