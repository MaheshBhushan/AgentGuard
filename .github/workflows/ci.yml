name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy agentguard
      - run: pytest --cov=agentguard --cov-report=term-missing

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Dogfood AgentGuard on its own pull request
        uses: ./
        if: github.event_name == 'pull_request'
        with:
          profile: minimal
          fail-on: error,incomplete
      - name: Dogfood AgentGuard on pushed commit
        uses: ./
        if: github.event_name == 'push'
        with:
          base-ref: HEAD~1
          profile: minimal
          fail-on: error,incomplete
