name: AgentGuard

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          profile: auto
          annotations: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          fail-on: error,incomplete
