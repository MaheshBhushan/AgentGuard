name: AgentGuard

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          profile: minimal
          fail-on: error,incomplete
