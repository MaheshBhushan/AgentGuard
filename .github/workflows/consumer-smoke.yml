name: Consumer Action smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run local AgentGuard candidate
        uses: ./
        with:
          base-ref: HEAD~1
          profile: minimal
          install-analyzers: "false"
