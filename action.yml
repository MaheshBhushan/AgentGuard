name: AgentGuard quality gate
description: Deterministic quality gates for AI-generated code changes
author: Mahesh Bhushan
branding:
  icon: shield
  color: blue
inputs:
  base-ref:
    description: Git revision to compare against; auto uses the pull-request base
    required: false
    default: auto
  config:
    description: Path to an AgentGuard YAML or TOML configuration file
    required: false
    default: ""
  profile:
    description: Analyzer profile (auto, minimal, python, typescript, security, or full)
    required: false
    default: auto
  minimum-score:
    description: Optional minimum quality score override
    required: false
    default: ""
  fail-on:
    description: Comma-separated outcomes that fail the step
    required: false
    default: fail,incomplete,error
  timeout:
    description: Per-tool timeout in seconds
    required: false
    default: "300"
  install-analyzers:
    description: Install pinned tools required by the selected profile
    required: false
    default: "true"
  post-comment:
    description: Reserved for optional PR reporting
    required: false
    default: "false"
  annotations:
    description: Reserved for optional workflow annotations
    required: false
    default: "false"
  upload-report:
    description: Reserved for optional report artifact upload
    required: false
    default: "false"
  token:
    description: GitHub token reserved for optional PR reporting
    required: false
    default: ${{ github.token }}
outputs:
  verdict:
    description: pass, fail, incomplete, error, or skipped
    value: ${{ steps.agentguard.outputs.verdict }}
  quality-score:
    description: Quality score from 0 to 100
    value: ${{ steps.agentguard.outputs.quality-score }}
  findings-count:
    description: Number of normalized findings
    value: ${{ steps.agentguard.outputs.findings-count }}
  policy-failures:
    description: JSON array of failed policy names
    value: ${{ steps.agentguard.outputs.policy-failures }}
  analyzers-executed:
    description: JSON array of completed analyzer names
    value: ${{ steps.agentguard.outputs.analyzers-executed }}
  analyzers-unavailable:
    description: JSON array of unavailable analyzer names
    value: ${{ steps.agentguard.outputs.analyzers-unavailable }}
  report-path:
    description: Absolute path to the JSON report
    value: ${{ steps.agentguard.outputs.report-path }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install AgentGuard
      shell: bash
      env:
        AGENTGUARD_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$AGENTGUARD_ACTION_PATH"
    - name: Run AgentGuard
      id: agentguard
      shell: bash
      env:
        AGENTGUARD_INPUT_BASE_REF: ${{ inputs.base-ref }}
        AGENTGUARD_INPUT_CONFIG: ${{ inputs.config }}
        AGENTGUARD_INPUT_PROFILE: ${{ inputs.profile }}
        AGENTGUARD_INPUT_MINIMUM_SCORE: ${{ inputs.minimum-score }}
        AGENTGUARD_INPUT_FAIL_ON: ${{ inputs.fail-on }}
        AGENTGUARD_INPUT_TIMEOUT: ${{ inputs.timeout }}
        AGENTGUARD_INPUT_INSTALL_ANALYZERS: ${{ inputs.install-analyzers }}
      run: python -m agentguard.integrations.github_action
