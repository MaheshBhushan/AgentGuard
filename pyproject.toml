[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentguard-quality"
version = "0.1.0"
description = "A deterministic quality gate for AI-generated code"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Mahesh Bhushan" }]
keywords = ["ai-agents", "code-quality", "github-actions", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["typer>=0.12", "pydantic>=2.7", "rich>=13.7", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/MaheshBhushan/AgentGuard"
Documentation = "https://github.com/MaheshBhushan/AgentGuard#readme"
Issues = "https://github.com/MaheshBhushan/AgentGuard/issues"
Source = "https://github.com/MaheshBhushan/AgentGuard"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-json-report>=1.5", "mypy>=1.10", "ruff>=0.5", "types-PyYAML>=6.0"]

[project.scripts]
agentguard = "agentguard.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["agentguard"]

[tool.hatch.build.targets.sdist]
include = [
  "agentguard",
  "docs",
  "schemas",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
